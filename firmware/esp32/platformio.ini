; MORPH ESP32 firmware (PlatformIO).
;   Build only (no board needed):   pio run -e esp32dev
;   Do NOT upload until the hardware checklist in README.md is complete.
;
; ASSUMPTION: a generic ESP32 DevKit (ESP32-WROOM-32, "esp32dev"). The exact board is
; UNKNOWN; change `board` once it is confirmed (e.g. an ESP32-S3 board needs a different id).

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
